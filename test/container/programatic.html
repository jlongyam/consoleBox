<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test:  container - programatic</title>
  <style>
    @import '../../dist/console.css';
    #container {
      position: relative;
      height: 300px;
      border: 2px solid orange;
    }
  </style>
  <script type="module">
    import consoleBox from '../../dist/console.mjs';
    window.defaultConsole = window.console
    delete window.console;
    let parent = document.createElement('div');
    parent.id = 'container';
    document.body.appendChild(parent)
    window.console = consoleBox(parent);
  </script>
</head>
