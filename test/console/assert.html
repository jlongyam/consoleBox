<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test: console.assert</title>
  <style>
    @import '../../dist/console.css';
    html { height: 100%; }
    body {
      position: relative;
      height: 100%;
      margin: 0;
    }
  </style>
  <script type="module">
    import consoleBox from '../../dist/console.mjs';
    window.defaultConsole = window.console
    delete window.console;
    window.console = consoleBox();
  </script>
</head>
<body>
  <script type="module">
    const x = 5;
    const y = 3;
    const reason = 'x is expected to be less than y';
    console.assert(x < y, {x, y, reason});
  </script>
  </script>
</body>
</html>
