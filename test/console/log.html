<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test: console.log</title>
  <style>
    @import '../../dist/console.css';
    html { height: 100%; }
    body {
      position: relative;
      height: 100%;
      margin: 0;
    }
  </style>
  <script type="module">
    import consoleBox from '../../dist/console.mjs';
    window.defaultConsole = window.console
    delete window.console;
    window.console = consoleBox();
  </script>
</head>
<body>
  <script type="module">
    console.log('log');
    console.info('info');
    console.warn('warn');
    console.debug('debug');
    console.error("error");
  </script>
</body>
</html>
